name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd ../careerpath-mobile
          npm ci || npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install -g @capacitor/cli

      - name: Build frontend and copy assets
        run: |
          cd frontend
          npm run build
          cd ../careerpath-mobile
          node scripts/copy-frontend.js

      - name: Sync Capacitor
        run: |
          cd careerpath-mobile
          npx cap sync android

      - name: Create release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD is not configured" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD is not configured" && exit 1)
          keytool -genkeypair -v \
            -keystore careerpath-release.keystore \
            -storetype JKS \
            -alias careerpath \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CareerPath, OU=Development, O=CareerPath Inc, L=City, S=State, C=US"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd careerpath-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=../../careerpath-release.keystore \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS=careerpath \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify and name APK
        run: |
          cd careerpath-mobile/android/app/build/outputs/apk/release
          if [ -f "app-release.apk" ]; then
            mv app-release.apk CareerPath.apk
          fi
          APK=$(ls *.apk | head -n 1)
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath
          path: careerpath-mobile/android/app/build/outputs/apk/release/*.apk
