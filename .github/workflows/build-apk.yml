name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd ../careerpath-mobile
          npm ci || npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install -g @capacitor/cli

      - name: Build frontend and copy assets
        run: |
          cd frontend
          npm run build
          cd ../careerpath-mobile
          node scripts/copy-frontend.js

      - name: Sync Capacitor
        run: |
          cd careerpath-mobile
          npx cap sync android

      - name: Create release keystore
        if: ${{ env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' }}
        run: |
          keytool -genkeypair -v \
            -keystore careerpath-release.keystore \
            -storetype JKS \
            -alias careerpath \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CareerPath, OU=Development, O=CareerPath Inc, L=City, S=State, C=US"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd careerpath-mobile/android
          chmod +x gradlew
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew assembleRelease \
              -PRELEASE_STORE_FILE=../../careerpath-release.keystore \
              -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS=careerpath \
              -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Verify and name APK
        run: |
          cd careerpath-mobile/android/app/build/outputs/apk/release
          if [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk CareerPath.apk
          elif [ -f "app-release.apk" ]; then
            mv app-release.apk CareerPath.apk
          fi

          if [ ! -f "CareerPath.apk" ]; then
            echo "No APK artifact was produced by the build."
            exit 1
          fi

          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            APK="CareerPath.apk"
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          else
            echo "Skipping APK signature verification because release secrets are not configured."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath
          path: careerpath-mobile/android/app/build/outputs/apk/release/*.apk
