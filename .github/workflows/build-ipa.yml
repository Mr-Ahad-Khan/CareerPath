name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "careerpath-ios/**"
      - "frontend/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend dist into iOS project
        run: |
          mkdir -p careerpath-ios/dist
          cp -R frontend/dist/. careerpath-ios/dist/
          ls -la careerpath-ios/dist

      - name: Install iOS project deps
        working-directory: careerpath-ios
        run: npm install

      - name: Add iOS platform
        working-directory: careerpath-ios
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        working-directory: careerpath-ios
        run: npx cap sync ios

      - name: List iOS project
        working-directory: careerpath-ios/ios/App
        run: |
          echo "== ios/App =="
          ls -la
          echo "== xcodeproj =="
          ls -d *.xcodeproj 2>/dev/null || echo "no xcodeproj here"

      - name: Build iOS archive
        working-directory: careerpath-ios/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Verify archive exists
        run: |
          echo "== Checking archive =="
          ls -la $RUNNER_TEMP/ || true
          find $RUNNER_TEMP -name "*.xcarchive" -maxdepth 2 || true
          find $RUNNER_TEMP -name "*.app" -maxdepth 5 || true

      - name: Create IPA
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/App.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive not found at $ARCHIVE_PATH"
            exit 1
          fi

          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app inside archive"
            ls -la "$ARCHIVE_PATH/Products/" || true
            exit 1
          fi

          echo "✅ App found: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r CareerPath.ipa Payload
          ls -la CareerPath.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath-ipa
          path: $RUNNER_TEMP/CareerPath.ipa
          if-no-files-found: error
