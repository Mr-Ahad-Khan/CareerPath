name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "careerpath-ios/**"
      - "frontend/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend dist into iOS project
        run: |
          mkdir -p careerpath-ios/dist
          cp -R frontend/dist/. careerpath-ios/dist/
          echo "=== Files copied to careerpath-ios/dist ==="
          ls -la careerpath-ios/dist

      - name: Install iOS project dependencies
        working-directory: careerpath-ios
        run: npm install

      - name: Add iOS platform (first run only)
        working-directory: careerpath-ios
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        working-directory: careerpath-ios
        run: npx cap sync ios

      - name: Inspect iOS project layout
        working-directory: careerpath-ios/ios/App
        run: |
          echo "=== Contents of ios/App ==="
          ls -la
          echo ""
          echo "=== Looking for project files ==="
          find . -maxdepth 2 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" \)
          echo ""
          echo "=== Xcode schemes available ==="
          xcodebuild -list -project App.xcodeproj 2>&1 || xcodebuild -list -workspace App.xcworkspace 2>&1 || echo "Could not list schemes"

      - name: Build unsigned archive
        working-directory: careerpath-ios/ios/App
        run: |
          set -e

          if [ -d "App.xcworkspace" ]; then
            PROJECT_FLAG="-workspace App.xcworkspace"
            echo "Using workspace: App.xcworkspace"
          else
            PROJECT_FLAG="-project App.xcodeproj"
            echo "Using project: App.xcodeproj"
          fi

          xcodebuild clean archive \
            $PROJECT_FLAG \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect archive contents
        run: |
          echo "=== Archive root ==="
          ls -la $RUNNER_TEMP/App.xcarchive/ || echo "❌ NO ARCHIVE AT ALL"
          echo ""
          echo "=== Products/Applications ==="
          ls -la $RUNNER_TEMP/App.xcarchive/Products/Applications/ || echo "❌ NO PRODUCTS DIR"
          echo ""
          echo "=== Any .app anywhere in archive ==="
          find $RUNNER_TEMP/App.xcarchive -name "*.app" -maxdepth 5 2>/dev/null || echo "❌ NO .app FOUND"

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p $RUNNER_TEMP/Payload

          APP_PATH=$(find $RUNNER_TEMP/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in archive. Cannot package IPA."
            exit 1
          fi

          echo "✅ Found app at: $APP_PATH"
          cp -R "$APP_PATH" $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r CareerPath-unsigned.ipa Payload
          echo ""
          echo "=== IPA created ==="
          ls -la CareerPath-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: $RUNNER_TEMP/CareerPath-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
