name: Build and Release Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli
    
    - name: Create web assets
      run: |
        mkdir -p dist
        cat > dist/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <title>CareerPath</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { margin: 0; padding: 0; overflow: hidden; height: 100vh; width: 100vw; background: #f5f5f5; }
            iframe { width: 100%; height: 100%; border: none; display: block; }
            #loading {
              position: fixed; top: 0; left: 0; right: 0; bottom: 0;
              display: flex; justify-content: center; align-items: center;
              background: #ffffff; z-index: 9999; flex-direction: column;
            }
            #loading .logo { font-size: 48px; font-weight: bold; color: #4CAF50; }
            #loading p { margin-top: 20px; font-family: sans-serif; color: #666; font-size: 16px; }
            .loading-spinner {
              width: 40px; height: 40px;
              border: 4px solid #f3f3f3;
              border-top: 4px solid #4CAF50;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin-top: 20px;
            }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          </style>
        </head>
        <body>
          <div id="loading">
            <div class="logo">🚀 CareerPath</div>
            <p>Loading your career journey...</p>
            <div class="loading-spinner"></div>
          </div>
          <iframe src="https://career-path-five-ruby.vercel.app" allow="geolocation; microphone; camera; midi; encrypted-media" onload="document.getElementById('loading').style.display='none'"></iframe>
        </body>
        </html>
        EOF
    
    - name: Add Android platform
      run: npx cap add android
    
    - name: Copy web assets to Android
      run: npx cap copy android
    
    - name: Create keystore
      run: |
        keytool -genkey -v -keystore release-key.keystore -alias careerpath -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          -dname "CN=CareerPath, OU=Development, O=CareerPath Inc, L=City, S=State, C=US"
    
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Sign APK
      run: |
        cd android/app/build/outputs/apk/release
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore ../../../../../release-key.keystore \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          app-release-unsigned.apk careerpath
        jarsigner -verify app-release-unsigned.apk
    
    - name: Align APK
      run: |
        cd android/app/build/outputs/apk/release
        $ANDROID_HOME/build-tools/33.0.2/zipalign -v -p 4 \
          app-release-unsigned.apk CareerPath.apk
    
    - name: Rename APK
      run: |
        cd android/app/build/outputs/apk/release
        mv CareerPath.apk CareerPath-${{ github.run_number }}.apk
    
    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CareerPath-APK
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/release/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Deploy to Google Play Console
  deploy-playstore:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: CareerPath-APK
        path: apk
    
    - name: Upload to Google Play Console
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: com.careerpath.app
        releaseFiles: apk/*.apk
        track: internal
        status: completed
        whatsNewDirectory: distribution/whatsnew
