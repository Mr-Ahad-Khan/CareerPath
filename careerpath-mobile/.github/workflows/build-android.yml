name: Build and Release Android App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd ../careerpath-mobile
          npm ci || npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Build frontend and copy assets
        run: |
          cd frontend
          npm run build
          cd ../careerpath-mobile
          node scripts/copy-frontend.js

      - name: Sync Capacitor to Android
        run: |
          cd careerpath-mobile
          npx cap sync android

      - name: Create keystore
        run: |
          cd careerpath-mobile
          keytool -genkey -v -keystore release-key.keystore -alias careerpath -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype JKS \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=CareerPath, OU=Development, O=CareerPath Inc, L=City, S=State, C=US"

      - name: Build Android APK
        run: |
          cd careerpath-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=../release-key.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS=careerpath \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK
        run: |
          cd careerpath-mobile/android/app/build/outputs/apk/release
          if [ -f "app-release.apk" ]; then
            mv app-release.apk CareerPath.apk
          fi

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CareerPath
          path: careerpath-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: careerpath-mobile/android/app/build/outputs/apk/release/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Deploy to Google Play Console
  deploy-playstore:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CareerPath-APK
          path: apk

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.careerpath.app
          releaseFiles: apk/*.apk
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
